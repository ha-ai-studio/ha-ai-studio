name: Release container and notes
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ha-ai-studio/ha-ai-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
      image-id: ${{ steps.image.outputs.id }}
      target: ${{ steps.metadata.outputs.target }}
    env:
      BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and image destination
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_metadata.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Test release tooling including Git history ranges
        run: python3 -m unittest discover -s tests -p 'test_release*.py' -v
      - name: Build amd64 release image once
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: docker compose build --quiet
      - name: Export built image
        id: image
        run: |
          docker save ha-ai-studio:dev -o "$RUNNER_TEMP/image.tar"
          echo "id=$(docker image inspect ha-ai-studio:dev --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Upload built image
        id: image-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amd64-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 7
  test:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Assets, API and package tests
            command: STUDIO_TEST_GROUP=core ./scripts/test.sh --skip-build
          - name: Git plugin tests
            command: STUDIO_TEST_GROUP=plugins ./scripts/test.sh --skip-build
          - name: Plugin release tests
            command: STUDIO_TEST_GROUP=releases ./scripts/test.sh --skip-build
          - name: Local plugin tests
            command: STUDIO_TEST_GROUP=local ./scripts/test.sh --skip-build
          - name: MQTT integration tests
            command: ./scripts/test-mqtt.sh
          - name: TLS and topic permissions
            command: ./scripts/test-mqtt-security.sh
          - name: Security checks
            command: ./scripts/security-check.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download built image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/built-image
      - name: Load and verify built image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: |
          docker load -i "$RUNNER_TEMP/built-image/image.tar"
          test "$(docker image inspect ha-ai-studio:dev --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
      - name: Run check
        if: matrix.name != 'Security checks'
        run: ${{ matrix.command }}
      - name: Check secrets in Git history and source
        if: matrix.name == 'Security checks'
        run: ./scripts/security-check.sh secrets
      - name: Audit Python dependencies
        if: matrix.name == 'Security checks'
        run: ./scripts/security-check.sh dependencies
      - name: Select Grype cache date
        if: matrix.name == 'Security checks'
        id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore Grype vulnerability database
        if: matrix.name == 'Security checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grype-db
          key: grype-${{ runner.os }}-${{ hashFiles('scripts/security-check.sh') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            grype-${{ runner.os }}-${{ hashFiles('scripts/security-check.sh') }}-
      - name: Update Grype vulnerability database
        if: matrix.name == 'Security checks'
        env:
          SECURITY_GRYPE_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: ./scripts/security-check.sh grype-db
      - name: Scan built image for vulnerabilities
        if: matrix.name == 'Security checks'
        env:
          SECURITY_GRYPE_CACHE_DIR: ${{ runner.temp }}/grype-db
          SECURITY_IMAGE_ARCHIVE: ${{ runner.temp }}/built-image/image.tar
        run: ./scripts/security-check.sh image
  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download built image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/built-image
      - name: Load and verify built image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: |
          docker load -i "$RUNNER_TEMP/built-image/image.tar"
          test "$(docker image inspect ha-ai-studio:dev --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
      - name: Prepare release notes
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_MODEL: ${{ vars.OPENAI_RELEASE_MODEL }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish the exact tested image
        env:
          TARGET: ${{ needs.build.outputs.target }}
        run: |
          docker tag ha-ai-studio:dev "$TARGET"
          docker push "$TARGET"
          echo "Published: $TARGET (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "HA AI Studio $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
